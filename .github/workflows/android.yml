# The game is not in this repository. The workflow needs sys/main.dol of your own disc (US RWLE01, rev 0).
# Two ways to give it to the workflow, in this order:
#   1. Repository secret WARIO_DATA_URL: a direct download link to main.dol (a zip that contains sys/main.dol also
#      works). Dropbox links are fine (the workflow changes dl=0 to dl=1). Google Drive is not reliable.
#   2. Otherwise, a release named "game-data" in this repo with main.dol attached.
# The main.dol checksum is verified below.
name: Android APK

# Builds Wario Land: Shake it! for Android (arm64-v8a) entirely on GitHub Actions.
#
# The game is not in this repository. Create a repository secret WARIO_DATA_URL that points to a
# .zip of your own disc's DATA folder (it must contain sys/main.dol, sys/boot.bin and files/).
# The main.dol checksum is verified below (US RWLE01, revision 0).

on:
  workflow_dispatch:
    inputs:
      reuse_translation:
        description: "Reusar la última traducción guardada (rápido: solo regenera los shards con el runtime actual). Úsalo para cambios solo en runtime/; NO si cambió el juego, el traductor o projects/wario."
        type: boolean
        default: false

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SDL_VERSION: "3.4.4"        # same as AURORA_SDL3_VERSION in aurora/CMakeLists.txt
      NDK_VERSION: "27.0.12077973"
      # ccache keeps the C/C++ objects of the translated game between runs (see the cache step below).
      CCACHE_DIR: /home/runner/.cache/ccache-wario
      CCACHE_MAXSIZE: "3G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      # The compiler check decides whether cached objects are still valid. The default (the compiler's
      # mtime) changes whenever the NDK is restored from the cache with new timestamps, which would
      # throw the whole object cache away. A string pinned to the NDK version does not.
      CCACHE_COMPILERCHECK: "string:27.0.12077973"
      # Dependency sources (SDL, Dawn, abseil, ...) live here, so they can be cached between runs.
      # Android SDK preinstalled on the ubuntu-24.04 runner image.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      # Dependency sources go outside the workspace on purpose: setup-gradle validates every gradle-wrapper.jar it
      # finds under the workspace, and SDL's own wrapper jar (inside the fetched sources) is not one it knows.
      # (runner.temp is not available in job-level env, so the value is written here.)
      - name: Set dependency folder outside the workspace
        run: echo "WARIO_FETCH_DIR=$RUNNER_TEMP/wario-fetch" >> "$GITHUB_ENV"

      # A stale seed makes every GX shader compile on first use on the phone (stutter in new zones).
      # This does not fail the build; it leaves a warning on the run. Regenerate with tools/promote_pipeline_seed.py.
      - name: Check the bundled pipeline seed
        run: |
          python3 tools/check_pipeline_seed.py || echo "::warning::La semilla de pipelines está obsoleta: los shaders nuevos se compilarán en el teléfono (tirones). Ver CAMBIOS_SHADERS.md."

      # Each translated-code shard needs about 2 GB of RAM to compile (the PC build's rule, tools/build-wario.ps1),
      # so the job count is the smaller of the cores and (RAM - 6 GB) / 2.
      - name: Set parallel jobs
        run: |
          cores=$(nproc)
          ram_gb=$(awk '/MemTotal/ {printf "%d", $2 / 1024 / 1024}' /proc/meminfo)
          jobs=$(( (ram_gb - 6) / 2 ))
          if [ "$jobs" -gt "$cores" ]; then jobs=$cores; fi
          if [ "$jobs" -lt 1 ]; then jobs=1; fi
          echo "WARIO_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "Translated-code shard jobs: $jobs (cores $cores, RAM ${ram_gb} GB)"

      - name: Free disk space on the runner
        # The translated runtime and its object files need more room than the default runner image leaves free.
        run: |
          echo "Antes:"; df -h /
          sudo rm -rf /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/az_* /usr/lib/google-cloud-sdk \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator || true
          sudo docker image prune --all --force || true
          echo "Después:"; df -h /

      # The NDK is about 1.5 GB. Cache it after the cleanup above (which removes the preinstalled NDK),
      # so repeated runs restore it from the cache instead of downloading it again from Google.
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download and check main.dol
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WARIO_DATA_URL: ${{ secrets.WARIO_DATA_URL }}
        run: |
          set -e
          mkdir -p game
          if [ -n "$WARIO_DATA_URL" ]; then
            # Secret: a direct link to main.dol (or to a zip that contains sys/main.dol).
            URL="$WARIO_DATA_URL"
            if [[ "$URL" == *drive.google.com* ]]; then
              ID=$(echo "$URL" | sed -E 's/.*[?&]id=([^&]+).*/\1/; s#.*/d/([^/?]+).*#\1#')
              URL="https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
            fi
            # Dropbox links open a preview page unless they ask for a download (dl=1).
            URL="${URL/dl=0/dl=1}"
            curl -fL --retry 3 -o /tmp/download.bin "$URL" \
              || { echo "::error::No pude descargar WARIO_DATA_URL. Revisa que sea un enlace de descarga directa."; exit 1; }
            if unzip -tq /tmp/download.bin > /dev/null 2>&1; then
              # A zip: take sys/main.dol out of it.
              rm -rf /tmp/gamedata && mkdir -p /tmp/gamedata
              unzip -q /tmp/download.bin -d /tmp/gamedata
              DOL=$(find /tmp/gamedata -path '*/sys/main.dol' | head -n 1)
              [ -n "$DOL" ] || { echo "::error::El zip no contiene sys/main.dol."; exit 1; }
              cp "$DOL" game/main.dol
            else
              # Not a zip: it must be main.dol itself. An HTML page here means the link is a preview or a
              # quota page, not the file.
              if head -c 15 /tmp/download.bin | grep -qi "<!doctype\|<html"; then
                echo "::error::El enlace devolvió una página web, no el archivo. Usa un enlace de descarga directa."
                exit 1
              fi
              cp /tmp/download.bin game/main.dol
            fi
          else
            # Default: a release named game-data with main.dol attached (see android/README.md).
            gh release download game-data -R "$GITHUB_REPOSITORY" -p "main.dol" -O game/main.dol \
              || { echo "::error::No encuentro el release 'game-data' con el archivo main.dol. Configura el secreto WARIO_DATA_URL o sube ese archivo (ver android/README.md)."; exit 1; }
          fi
          echo "053be60dde84c8042f45ed2f4ba80c17efb2d20fedf95a414c2c7e37d336912a  game/main.dol" | sha256sum -c - \
            || { echo "::error::main.dol no coincide con el checksum de RWLE01 rev. 0. Revisa que sea el archivo correcto."; exit 1; }

      # The translation cache key is computed once, here, before any build step runs. It uses the git tree
      # hashes of the translator and the project (only committed files, so the bin/ and obj/ that
      # `dotnet build` creates never change it) plus the checksum of main.dol. Restore and save below both
      # use this same key. Before, the key was re-hashed at save time, after `dotnet build` had written
      # bin/ and obj/ inside fw/translator, so every save landed under a key no later run ever asked for.
      - name: Translation cache key
        id: tkey
        run: |
          set -e
          TR_TREE=$(git rev-parse "HEAD:fw/translator")
          PR_TREE=$(git rev-parse "HEAD:projects/wario")
          DOL=$(sha256sum game/main.dol | cut -c1-16)
          KEY="translated-v2-${DOL}-${TR_TREE:0:16}-${PR_TREE:0:16}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "::notice::Clave de traducción: $KEY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('fw/translator/**/*.csproj', 'fw/translator/**/packages.lock.json', 'fw/translator/**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # sdkmanager asks Google's repository for its index on every call, which costs a minute or more even
      # when nothing is downloaded. These packages are small and change only when the versions below change.
      - name: Cache SDK packages
        id: sdkpkgs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
            ${{ env.ANDROID_HOME }}/cmake/3.31.6
          key: android-sdk-pkgs-35-35.0.0-3.31.6

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          echo "Usando $SDKMANAGER"
          NDK_PATH="$ANDROID_HOME/ndk/${NDK_VERSION}"
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ] \
             && [ -d "$ANDROID_HOME/cmake/3.31.6" ] && [ -d "$NDK_PATH" ]; then
            echo "::notice::Paquetes del SDK ya presentes (caché): se omite sdkmanager."
          else
            yes | "$SDKMANAGER" --licenses > /dev/null
            if [ -d "$NDK_PATH" ]; then
              # Restored from the NDK cache: only the other packages are missing (or already present).
              "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6"
            else
              "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.31.6"
            fi
          fi
          # The runner sets ANDROID_NDK_HOME to its preinstalled NDK (which the cleanup step removed).
          # Point every NDK variable at the NDK we just installed, so CMake links against it.
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH"
            echo "ANDROID_NDK=$NDK_PATH"
          } >> "$GITHUB_ENV"
          # Some prebuilt dependency still links against an absolute NDK 29 path (liblog.so).
          # Make that path resolve to the NDK 27 we use; the sysroot provides the same liblog.so for API 28.
          sudo ln -sfn "$NDK_PATH" "$ANDROID_HOME/ndk/29.0.14206865"

      # The translated code depends only on main.dol, the translator and the project files, so a repeated
      # run restores it instead of translating ~28k functions again (about 4-5 minutes). Changes in runtime/src
      # do not invalidate it: the build shards, the only part that reads runtime/src, are regenerated below.
      - name: Restore translated code
        id: gen
        uses: actions/cache/restore@v4
        with:
          path: generated
          key: ${{ steps.tkey.outputs.key }}
          # Fallback used only with reuse_translation: the newest translation saved by an earlier run.
          restore-keys: |
            translated-v2-

      # Full translation: only when there is no usable cache, or when reuse_translation is off and the key missed.
      - name: Translate the game (WiiCompiled translator)
        id: translate
        # Runs only when there is no cached translation for this exact key (or when reuse_translation is off and nothing matched).
        if: steps.gen.outputs.cache-hit != 'true' && (inputs.reuse_translation != true || steps.gen.outputs.cache-matched-key == '')
        run: |
          dotnet build fw/translator/src/Translator.Cli/Translator.Cli.csproj -c Release
          TR="dotnet fw/translator/src/Translator.Cli/bin/Release/net8.0/Translator.Cli.dll"
          P=projects/wario/recomp.yml
          mkdir -p generated
          $TR translate-recursive 0x80006124 --project $P \
            --outdir generated/functions \
            --output-metadata generated/base_translation_output.json \
            --production-source-bundle generated/base_translation_sources.bin \
            --no-function-files --prune-stale --threads "$(nproc)"
          $TR generate-data-init --project $P
          $TR emit-build-shards --project $P \
            --base-metadata generated/base_translation_output.json \
            --base-functions-dir generated/functions \
            --native-source-dir runtime/src \
            --out generated/build_shards

      # Fast path (reuse_translation=true): keep the restored translation and rebuild only the shards,
      # which depend on runtime/src (native registration). Not saved back to the cache: the cache keeps
      # translations that were produced from their own runtime version.
      - name: Regenerate build shards with the current runtime (reuse_translation)
        if: steps.gen.outputs.cache-hit != 'true' && inputs.reuse_translation == true && steps.gen.outputs.cache-matched-key != ''
        run: |
          echo "::notice::Reutilizando la traducción de la clave: ${{ steps.gen.outputs.cache-matched-key }}"
          dotnet build fw/translator/src/Translator.Cli/Translator.Cli.csproj -c Release
          TR="dotnet fw/translator/src/Translator.Cli/bin/Release/net8.0/Translator.Cli.dll"
          P=projects/wario/recomp.yml
          $TR emit-build-shards --project $P \
            --base-metadata generated/base_translation_output.json \
            --base-functions-dir generated/functions \
            --native-source-dir runtime/src \
            --out generated/build_shards

      - name: Regenerate build shards (translation restored from cache)
        if: steps.gen.outputs.cache-hit == 'true'
        run: |
          dotnet build fw/translator/src/Translator.Cli/Translator.Cli.csproj -c Release
          TR="dotnet fw/translator/src/Translator.Cli/bin/Release/net8.0/Translator.Cli.dll"
          P=projects/wario/recomp.yml
          rm -rf generated/build_shards
          $TR emit-build-shards --project $P \
            --base-metadata generated/base_translation_output.json \
            --base-functions-dir generated/functions \
            --native-source-dir runtime/src \
            --out generated/build_shards

      # Explicit save: actions/cache@v4 saves in its post step, which runs only when the whole job succeeds, so a
      # translation made by a run that fails later (the APK build) was never kept.
      - name: Save translated code
        if: steps.gen.outputs.cache-hit != 'true' && steps.translate.outcome == 'success' && inputs.reuse_translation != true
        uses: actions/cache/save@v4
        with:
          path: generated
          key: ${{ steps.tkey.outputs.key }}

      - name: Get the SDL3 Java glue (matches the SDL3 the runtime builds)
        run: |
          # Extract outside the workspace: SDL's own gradle-wrapper.jar would fail setup-gradle's validation.
          mkdir -p /tmp/sdl
          curl -fL -o /tmp/sdl/sdl.tar.gz "https://github.com/libsdl-org/SDL/archive/refs/tags/release-${SDL_VERSION}.tar.gz"
          tar xzf /tmp/sdl/sdl.tar.gz -C /tmp/sdl
          SRC="/tmp/sdl/SDL-release-${SDL_VERSION}/android-project/app/src/main/java/org/libsdl/app"
          mkdir -p android/app/src/main/java/org/libsdl
          cp -r "$SRC" android/app/src/main/java/org/libsdl/

      # Dependency sources and their sub-build stamps, so CMake does not download them again. The build
      # folders (*-build) are not cached: their objects are reused through ccache instead, which is smaller.
      - name: Cache dependency downloads
        id: fetchcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/wario-fetch/*-src
            ${{ runner.temp }}/wario-fetch/*-subbuild
          key: fetch-${{ hashFiles('runtime/CMakeLists.txt', 'runtime/cmake/**', 'aurora/CMakeLists.txt', 'aurora/cmake/**', 'aurora/extern/CMakeLists.txt') }}-sdl${{ env.SDL_VERSION }}
          restore-keys: |
            fetch-

      - name: Install ccache
        run: |
          if ! command -v ccache > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          fi
          ccache --version | head -n 1

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # Each run restores the latest entry and saves its own below, so the cache keeps improving.
          key: ccache-arm64-${{ github.run_id }}
          restore-keys: |
            ccache-arm64-

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: android
        env:
          WARIO_CCACHE: "1"
          # Diagnóstico: por qué ccache no acierta (ver el artefacto ccache-log).
          CCACHE_LOGFILE: ${{ runner.temp }}/ccache.log
        run: |
          ccache --zero-stats
          start=$(date +%s)
          gradle :app:assembleRelease --no-daemon --stacktrace
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Runs even when the build fails: the hit rate tells whether the object cache is working.
      # Writes the numbers to the job summary, and decides below whether the cache is worth saving again.
      - name: ccache statistics
        id: ccstats
        if: always()
        run: |
          # The job can stop before the build (for example, when the game data is missing). Then ccache was never
          # installed or used, so there is nothing to report and nothing to save.
          if ! command -v ccache > /dev/null || [ ! -d "$CCACHE_DIR" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ccache no se usó en este run (el job se detuvo antes del build)."
            exit 0
          fi
          echo "has=true" >> "$GITHUB_OUTPUT"
          ccache --show-stats || true
          stats=$(ccache --print-stats 2>/dev/null || true)
          get() { local v; v=$(echo "$stats" | awk -v k="$1" '$1 == k { print $2 }'); echo "${v:-0}"; }
          hits=$(( $(get direct_cache_hit) + $(get preprocessed_cache_hit) ))
          misses=$(get cache_miss)
          total=$(( hits + misses ))
          if [ "$total" -gt 0 ]; then rate=$(( hits * 100 / total )); else rate=0; fi
          restored="${{ steps.ccache.outputs.cache-matched-key }}"
          # Save when there was nothing to restore, or when more than 3 % of the compiles missed.
          # Otherwise the restored entry is already good, and saving 3 GB again only costs minutes.
          save=false
          if [ -z "$restored" ] || [ "$total" -eq 0 ] || [ $(( misses * 100 / (total > 0 ? total : 1) )) -gt 3 ]; then
            save=true
          fi
          echo "save=$save" >> "$GITHUB_OUTPUT"
          {
            echo "## Build del APK"
            echo "- Tiempo de gradle: ${BUILD_SECONDS:-?} s"
            echo "- Clave de traducción: ${{ steps.tkey.outputs.key }}"
            echo "- Caché de ccache restaurada: ${restored:-ninguna}"
            echo "- Aciertos de ccache: ${hits} de ${total} (${rate} %)"
            echo "- ¿Se guarda ccache en este run?: $save"
          } >> "$GITHUB_STEP_SUMMARY"

      # Saved when the build fails (the objects compiled so far help the next run), and when the hit rate
      # shows that the restored cache is missing something. A run that hits almost everything skips the save.
      - name: Save dependency downloads
        if: always() && steps.fetchcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/wario-fetch/*-src
            ${{ runner.temp }}/wario-fetch/*-subbuild
          key: fetch-${{ hashFiles('runtime/CMakeLists.txt', 'runtime/cmake/**', 'aurora/CMakeLists.txt', 'aurora/cmake/**', 'aurora/extern/CMakeLists.txt') }}-sdl${{ env.SDL_VERSION }}

      - name: Save ccache
        if: always() && steps.ccstats.outputs.has == 'true' && (failure() || steps.ccstats.outputs.save == 'true')
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-arm64-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccache-log
          path: ${{ runner.temp }}/ccache.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wario-land-shake-it-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
